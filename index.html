<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hajatan Ngaliwett</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>🍚 Hajatan Ngaliwett</h1>
    <p class="lokasi">📍 Lokasi: Kosan Alist</p>

    <div class="countdown">
      <div class="box">
        <span id="days">00</span>
        <small>Hari</small>
      </div>
      <div class="box">
        <span id="hours">00</span>
        <small>Jam</small>
      </div>
      <div class="box">
        <span id="minutes">00</span>
        <small>Menit</small>
      </div>
      <div class="box">
        <span id="seconds">00</span>
        <small>Detik</small>
      </div>
    </div>

    <p id="info">Menuju Rabu • 07:00 WIB</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
